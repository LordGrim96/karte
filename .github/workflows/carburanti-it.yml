# Holt jeden Morgen die italienischen Spritpreise (MIMIT) und legt sie für das Tankbuch
# auf den Branch "carburanti-data" (immer nur ein Commit, die Historie wächst nicht).
name: Spritpreise Italien

on:
  schedule:
    - cron: "17 8 * * *"   # täglich ca. 9–10 Uhr italienischer Zeit (Daten mit Stand 8 Uhr)
  workflow_dispatch:
  push:                    # läuft auch direkt nach Änderungen am Skript
    branches: [main]
    paths:
      - scripts/carburanti_it.py
      - .github/workflows/carburanti-it.yml

permissions:
  contents: write

concurrency:
  group: carburanti-it
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # Token nicht im Arbeitsordner liegen lassen

      - name: Preise herunterladen
        env:
          PROXY: ${{ vars.CARBURANTI_PROXY }}   # Cloudflare-Zwischendienst (siehe cloudflare/ANLEITUNG.md)
        run: |
          # Der Server des Ministeriums ist manchmal langsam oder antwortet nur über eine
          # der Adressen/IP-Versionen – darum mehrere Versuche.
          dl() {
            if [ -n "$PROXY" ]; then
              echo "Versuche Cloudflare-Zwischendienst für $1"
              if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors --max-time 300 -o "$1" "$PROXY/$1"; then
                echo "OK: Zwischendienst ($(wc -c < "$1") Bytes)"; return 0
              fi
            fi
            for host in www.mimit.gov.it mimit.gov.it www.mise.gov.it; do
              for ipv in -4 -6; do
                echo "Versuche $host ($ipv) für $1"
                if curl $ipv -fsSL --retry 3 --retry-delay 15 --retry-all-errors --connect-timeout 30 --max-time 300 \
                     -A "Mozilla/5.0 (X11; Linux x86_64) tankbuch-data" -o "$1" "https://$host/images/exportCSV/$1"; then
                  echo "OK: $host $ipv ($(wc -c < "$1") Bytes)"; return 0
                fi
              done
            done
            return 1
          }
          dl anagrafica_impianti_attivi.csv
          dl prezzo_alle_8.csv
          head -n 3 anagrafica_impianti_attivi.csv
          head -n 3 prezzo_alle_8.csv

      - name: Preise aufbereiten
        run: python3 scripts/carburanti_it.py out anagrafica_impianti_attivi.csv prezzo_alle_8.csv

      - name: Auf Branch carburanti-data veröffentlichen
        run: |
          cd out
          git init -q -b carburanti-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Spritpreise Italien $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" carburanti-data
